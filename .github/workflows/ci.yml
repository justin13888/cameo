name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to match rust-toolchain.toml so formatting is reproducible:
      # rustfmt.toml uses nightly-only options (see its header). A dated nightly
      # is not a resolvable action ref, so select it via the `toolchain` input on
      # the generic `@master` action.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-26
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  check:
    name: Check (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "tmdb,cache"          # defaults
          - "anilist"             # AniList only, no TMDB, no cache
          - "anilist,cache"       # AniList + cache, no TMDB
          - "tmdb"                # TMDB without cache
          - "tmdb,anilist"        # TMDB + AniList, no cache
          - "tmdb,anilist,cache"  # all features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          key: ${{ matrix.features }}

      - name: Build
        run: cargo build --all-targets --no-default-features --features "${{ matrix.features }}"

      - name: Clippy
        run: cargo clippy --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings

      - name: Test
        run: cargo test --no-default-features --features "${{ matrix.features }}"

  doc-test:
    name: Doc tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Doc tests
        run: cargo test --doc --features tmdb,anilist,cache

  docs:
    name: Docs (docs.rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nightly + --cfg docsrs mirrors the docs.rs build and exercises doc_cfg.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: cargo doc --all-features --no-deps

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Check MSRV
        run: cargo check --all-targets --features tmdb,anilist,cache

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate lockfile
        run: cargo generate-lockfile
      # Prebuilt binary: `rustsec/audit-check` compiles cargo-audit with the
      # repo's pinned toolchain, which breaks whenever one of its dependencies
      # raises its minimum rustc above that pin.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  deny:
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  live-tests-compile:
    name: Live-tests compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      # Compile-only (no secrets): keeps the live-tests gate from bit-rotting.
      - name: cargo check (live-tests)
        run: cargo check --all-targets --features tmdb,anilist,cache,live-tests

  semver:
    name: SemVer compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compares the public API against the last published release and fails on
      # SemVer violations not permitted by the version bump. Breaking changes are
      # allowed only alongside a major (pre-1.0: minor) version bump.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features
