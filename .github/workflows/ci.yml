name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # `edited` re-runs the SemVer job when a pull request is retitled, since
    # it reads the title for a breaking marker. It also fires on body edits,
    # which re-runs the other jobs too; that cost is accepted.
    types: [opened, synchronize, reopened, edited]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to match rust-toolchain.toml so formatting is reproducible:
      # rustfmt.toml uses nightly-only options (see its header). A dated nightly
      # is not a resolvable action ref, so select it via the `toolchain` input on
      # the generic `@master` action.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-26
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  file-length:
    name: File length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The base branch's baseline is what this pull request's may not grow
      # past; on a push to master there is no base, and the growth check is
      # skipped.
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "${BASE_REF}"
      - name: Check file length
        env:
          FILE_LENGTH_BASE_REF: ${{ github.event_name == 'pull_request' && 'FETCH_HEAD' || '' }}
        run: ./scripts/check-file-length.sh

  check:
    name: Check (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "tmdb,cache"          # defaults
          - "anilist"             # AniList only, no TMDB, no cache
          - "anilist,cache"       # AniList + cache, no TMDB
          - "tmdb"                # TMDB without cache
          - "tmdb,anilist"        # TMDB + AniList, no cache
          - "tvdb"                # TheTVDB only, no TMDB, no cache
          - "tmdb,anilist,tvdb,cache"  # all features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          key: ${{ matrix.features }}

      - name: Build
        run: cargo build --all-targets --no-default-features --features "${{ matrix.features }}"

      - name: Clippy
        run: cargo clippy --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings

      - name: Test
        run: cargo test --no-default-features --features "${{ matrix.features }}"

      # The Docs job builds only --all-features; an intra-doc link to an item
      # gated behind a disabled feature only breaks on a feature subset.
      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --no-default-features --features "${{ matrix.features }}"

  doc-test:
    name: Doc tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Doc tests
        run: cargo test --doc --features tmdb,anilist,cache

  docs:
    name: Docs (docs.rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nightly + --cfg docsrs mirrors the docs.rs build and exercises doc_cfg.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: cargo doc --all-features --no-deps

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Check MSRV
        run: cargo check --all-targets --features tmdb,anilist,cache

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate lockfile
        run: cargo generate-lockfile
      # Prebuilt binary: `rustsec/audit-check` compiles cargo-audit with the
      # repo's pinned toolchain, which breaks whenever one of its dependencies
      # raises its minimum rustc above that pin.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  deny:
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  live-tests-compile:
    name: Live-tests compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      # Compile-only (no secrets): keeps the live-tests gate from bit-rotting.
      - name: cargo check (live-tests)
        run: cargo check --all-targets --features tmdb,anilist,cache,live-tests

  semver:
    name: SemVer compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release tags and the commit messages since the last one decide
          # the release type below.
          fetch-depth: 0
      # Pull requests never bump the version: release-plz's release pull request
      # does, from the Conventional Commits merged since the last release. So the
      # check takes its release type from those same commits instead of from
      # Cargo.toml. A breaking marker (`type!:` or a `BREAKING CHANGE:` footer)
      # in any commit since the last `v*` tag, or in this pull request's title
      # (the squash-merge subject), allows breaking changes; otherwise only
      # additive changes pass.
      - name: Derive release type from commits
        id: release-type
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          breaking='^[[:alpha:]]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:'
          # Collected first: under pipefail, `git log | grep -q` can fail with
          # SIGPIPE when grep exits at the first match.
          messages="$(git log --format=%B "${last_tag}..HEAD")"
          messages+=$'\n'"${PR_TITLE}"
          if grep -Eq "${breaking}" <<<"${messages}"; then
            type=major
          else
            type=minor
          fi
          echo "Release type for the changes since ${last_tag}: ${type}"
          echo "type=${type}" >> "${GITHUB_OUTPUT}"
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features
          release-type: ${{ steps.release-type.outputs.type }}
