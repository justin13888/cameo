name: Mutation testing

# Runs cargo-mutants over only the lines a pull request changes, so a change
# that adds code no test constrains fails here. Settings (excluded paths,
# timeouts, nextest as the test tool) live in .cargo/mutants.toml;
# `just mutants-diff` runs the same check locally (all shards' mutants at once).
#
# A large diff can mean hundreds of mutants, each needing a build and a test
# run, so the work is split round-robin across SHARDS parallel jobs (each with
# its own time limit) and one job, `Mutants (in diff)`, reports the outcome.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

# A new push supersedes the run for the previous head: cancel it rather than
# let hour-long shards pile up.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in step with the matrix below.
  SHARDS: 8

jobs:
  shard:
    name: Mutants (in diff, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Every shard reports its own missed mutants, even when another fails.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff against the base needs both histories.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          # Every shard (and the weekly full run) builds the same tree; share
          # one cache. It only speeds up the mutant builds because they run
          # --in-place, in ./target, rather than in a scratch copy.
          shared-key: mutants
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Diff against the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff "${BASE_SHA}...HEAD" > "${RUNNER_TEMP}/pr.diff"
      # Exits non-zero when a mutant in the changed lines survives (missed) or
      # times out. A shard that gets no mutants exits 0. --in-place mutates
      # this throwaway checkout instead of copying it, so builds reuse the
      # cached ./target.
      - name: cargo mutants --in-diff (shard ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          cargo mutants --no-shuffle --in-place --in-diff "${RUNNER_TEMP}/pr.diff"
          --shard "${SHARD}/${SHARDS}" --sharding round-robin
      - name: Upload the mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants.out-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  # One stable check for the whole run, whatever the shard count. It runs even
  # when the shards were cancelled (a newer push superseded them), and then
  # fails, which marks only that superseded commit red; `always()` rather than
  # `!cancelled()` so that, if this check is ever made required, a cancelled
  # run cannot count as passing.
  result:
    name: Mutants (in diff)
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARDS_RESULT: ${{ needs.shard.result }}
        run: |
          echo "shards: ${SHARDS_RESULT}"
          test "${SHARDS_RESULT}" = success
