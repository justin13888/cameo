[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "Repository automation for cameo (TMDB client codegen)."

# Standalone tooling crate with its OWN dependency graph and committed lockfile,
# deliberately declared as its own workspace root so the codegen dependency
# (spargen) never enters the cameo library's build graph. Invoke via
# `cargo xtask <cmd>` (see .cargo/config.toml).
[workspace]

[dependencies]
# Pinned so `cargo xtask codegen` reproduces src/generated/tmdb.rs byte-for-byte
# (spargen's output is deterministic per version + spec + config).
spargen = "=0.8.0"
