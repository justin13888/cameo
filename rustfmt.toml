# NOTE: these are nightly-only rustfmt options, so format with the latest
# nightly: `cargo +nightly fmt --all` (`just fmt`). This is the one documented
# nightly exception; the crate builds on the latest stable (rust-toolchain.toml)
# and on the MSRV (Cargo.toml `rust-version`), which the `msrv` CI job verifies.
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
