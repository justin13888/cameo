# NOTE: these are nightly-only rustfmt options, so `cargo fmt` requires the
# pinned nightly in rust-toolchain.toml (nightly-2026-02-26). This is the one
# documented nightly exception; the crate itself builds and is tested on the
# stable MSRV (1.88), which the `msrv` CI job verifies. Formatting is pinned
# for reproducibility.
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
