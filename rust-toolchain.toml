# Builds float on the latest stable: CI and every checkout use whatever stable
# is current, and breakage a new release brings (usually a new lint) is fixed
# here when it lands. This is not the support target: that is the MSRV,
# `rust-version` in Cargo.toml, which the `msrv` CI job builds on with
# `cargo +<msrv>`. Formatting alone needs nightly, for rustfmt.toml's
# nightly-only options: run it as `cargo +nightly fmt` (`just fmt`).
[toolchain]
channel = "stable"
components = [ "rustfmt", "clippy" ]
