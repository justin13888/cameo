[package]
name = "cameo"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Justin Chung <20733699+justin13888@users.noreply.github.com>"]
description = "Unified movie/TV show database SDK for Rust"
repository = "https://github.com/justin13888/cameo"
homepage = "https://github.com/justin13888/cameo"
documentation = "https://docs.rs/cameo"
readme = "README.md"
keywords = ["tmdb", "anilist", "movies", "tv", "metadata"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
exclude = ["scripts/", "openapi/", "xtask/", ".cargo/", ".config/", ".sidecar*", "AGENTS.md", "CLAUDE.md", ".github/", "lefthook.yaml", "rust-toolchain.toml", "DEVELOPMENT.md", "TESTING.md", ".claude/", "CHANGELOG.md", "justfile", "rustfmt.toml", "release-plz.toml"]

# docs.rs builds with all features and `--cfg docsrs` so feature-gated items
# render with `#[doc(cfg(...))]` badges.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "warn"

[features]
default = ["full"]
full = ["tmdb", "anilist", "tvdb", "cache"]
tmdb = ["dep:bytes", "dep:http", "dep:http-body", "dep:secrecy", "dep:url"]
anilist = []
tvdb = []
cache = ["dep:rusqlite", "dep:dirs"]
live-tests = [] # Gate for tests that hit the real provider APIs (TMDB and AniList)

[dependencies]
# Runtime of the spargen-generated TMDB client (src/generated/tmdb.rs embeds
# its own support code, so no generator crate is a dependency). The version
# floors are the ones spargen 0.8.0 tests its output against.
bytes = { version = "1.12.1", optional = true }
http = { version = "1.4.2", optional = true }
http-body = { version = "1.0.1", optional = true }
secrecy = { version = "0.10.3", optional = true }
url = { version = "2.5.8", optional = true }
# TLS backend pinned to rustls so the dependency tree is deterministic and has
# no system OpenSSL/native-tls requirement. 0.13.5 is spargen's floor.
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
    "http2",
    "charset",
    "system-proxy",
] }
# Async — `rt` is required for tokio::task::spawn_blocking (used by the SQLite
# cache) and `time`/`sync` for rate limiting and the cache mutex.
# 1.53.3 is past RUSTSEC-2026-0386 (spargen's floor since 0.6.0).
tokio = { version = "1.53.3", features = ["time", "sync", "rt"] }
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Civil dates in the public API (`PartialDate`, the discover date filters) and
# in the generated client's RFC 3339 `Date`. 1.0.1 is spargen 0.8.0's floor.
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
# Error handling
thiserror = "2"
# Logging
tracing = "0.1"
# Cache backend (optional)
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
dirs = { version = "6.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
async-trait = "0.1"
wiremock = "0.6"
pretty_assertions = "1"
dotenvy = "0.15"
proptest = "1"

[[example]]
name = "facade_showcase"
required-features = ["tmdb", "anilist"]

[[example]]
name = "tmdb_lowlevel"
required-features = ["tmdb"]

[[example]]
name = "anilist_showcase"
required-features = ["anilist"]

[[example]]
name = "cache_showcase"
required-features = ["tmdb", "cache"]

[[example]]
name = "error_handling"
required-features = ["tmdb"]

# Full DWARF for every crate is a large share of how fast target/ grows in a
# quick edit-build loop. This crate keeps line tables, so its backtraces and
# panics still carry file:line (but a debugger shows no locals); dependency
# frames keep their symbol names but lose file:line. `cargo test` inherits both
# settings. For full debug info, override per invocation:
# CARGO_PROFILE_DEV_DEBUG=2 for this crate, and/or
# `cargo --config 'profile.dev.package."*".debug=2' ...` for dependencies.
# xtask/ is its own workspace root, so these settings do not reach it.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
