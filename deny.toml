# cargo-deny configuration. Run locally with `cargo deny check`.

[advisories]
version = 2
# Fail on any unmaintained/vulnerable advisory or a yanked dependency.
yanked = "deny"

[licenses]
version = 2
# Permissive licenses compatible with cameo's own MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # webpki-root-certs vendors Mozilla's CA root store as *data* (no code) under
    # the Community Data License Agreement — Permissive. Pulled in transitively
    # via reqwest's rustls TLS stack.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions bloat the tree but aren't fatal in a young ecosystem.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only allow dependencies from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
