# cargo-mutants configuration (https://mutants.rs). Run it with `just mutants`
# (one module) or `just mutants-diff` (only the lines a branch changes); CI runs
# the in-diff form on every pull request (.github/workflows/mutants.yml).

# The vendored spargen client is regenerated by `cargo xtask codegen` and never
# edited by hand, so a surviving mutant there is not something a test here can
# or should kill.
exclude_globs = ["src/generated/**"]

# The default feature set is `full` (tmdb + anilist + tvdb + cache), so every
# provider's code is compiled and every test that reaches it runs.

# A mutant that turns a retry or pagination loop infinite is reported as a
# timeout rather than hanging the run; the multiplier is applied to the
# unmutated baseline test time.
timeout_multiplier = 3.0
