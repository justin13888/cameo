# cargo-mutants configuration (https://mutants.rs). Run it with `just mutants`
# (one module) or `just mutants-diff` (only the lines a branch changes); CI runs
# the in-diff form on every pull request (.github/workflows/mutants.yml) and the
# whole tree weekly (.github/workflows/mutants-full.yml), both split into shards.

# The vendored spargen client is regenerated by `cargo xtask codegen` and never
# edited by hand, so a surviving mutant there is not something a test here can
# or should kill.
#
# src/test_support.rs is compiled only into the unit tests: it is the test
# harness itself, not library behaviour a test could constrain.
exclude_globs = ["src/generated/**", "src/test_support.rs"]

# The default feature set is `full` (tmdb + anilist + tvdb + cache), so every
# provider's code is compiled and every test that reaches it runs.

# A mutant that turns a retry or pagination loop infinite is reported as a
# timeout rather than hanging the run; the multiplier is applied to the
# unmutated baseline test time.
timeout_multiplier = 3.0
# A floor under that auto-set timeout: a shared CI runner can make the baseline
# run unusually fast or a mutant's run unusually slow, and a timeout fails the
# run just like a missed mutant.
minimum_test_timeout = 60

# Each mutant's tests run under cargo-nextest (.config/nextest.toml), one
# process per test. Doctests are not part of a mutant's run. The `live_*` tests
# need the `live-tests` feature, which cargo-mutants never enables, so they are
# not even built.
test_tool = "nextest"
